services:
  postgres:
    image: postgres:16
    container_name: scholarship-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarship_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: scholarship-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scholarship_db?schema=public
      JWT_SECRET: scholarship-management-secret-key
      PORT: 5000
      FRONTEND_URL: http://localhost:5173

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: scholarship-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:5000

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
